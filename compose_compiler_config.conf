// Compose compiler stability configuration — applied to every module with the compose
// compiler plugin by the subprojects {} block in the root build.gradle.kts.
//
// INVARIANT: every type listed here MUST stay deeply immutable — all `val`, no `var`,
// no MutableList/MutableMap/MutableSet/Array fields, no mutable nested types.
// The compiler trusts this file blindly: a listed type that is mutated in place makes
// Compose skip recomposition on the old instance (equals() still true) => stale UI.
// Adding a `var` or a mutable collection to a class in a listed package means removing
// the package wildcard and listing the remaining classes individually.
//
// Collections: read-only interfaces only (MutableList/ArrayList/HashMap stay unstable),
// and `<*>` keeps an element type in the decision — List<Unstable> stays unstable.
kotlin.collections.List<*>
kotlin.collections.Set<*>
kotlin.collections.Collection<*>
kotlin.collections.Map<*,*>

// Domain models (verified 2026-11-04: data classes / enums / sealed interfaces, only `val`
// of primitives, String, read-only collections, same-package types; JsonObject is immutable).
com.antonchuraev.homesearchchecklist.feature.checklist.domain.model.**
com.antonchuraev.homesearchchecklist.feature.aichat.api.domain.model.**
com.antonchuraev.homesearchchecklist.feature.user.domain.model.**
