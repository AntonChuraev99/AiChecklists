  <main class="wrap">
    {{breadcrumb}}

    <header class="max-w-[52ch] pt-2 pb-2">
      <h1 class="t-display-s md:t-display-l mb-4">{{h1}}</h1>
      <p class="t-body-l text-on-surface-variant">{{intro}}</p>
    </header>

    <section class="mt-8 mb-16" aria-label="Checklist categories">
      <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
{{tiles}}
      </div>
    </section>
  </main>

  <!-- Bottom CTA band (reuse home final-CTA, full-bleed) -->
  <section class="ai-fill-hero text-white" aria-label="Start your own checklist with AI">
    <div class="wrap py-20 lg:py-24 text-center">
      <h2 class="t-headline-l md:t-display-s mb-4">{{uiBottomTitle}}</h2>
      <p class="t-body-l text-white/90 max-w-[48ch] mx-auto mb-8">{{uiBottomBody}}</p>
      <div class="flex flex-wrap items-center justify-center gap-3">
        <!-- Play reads campaign data ONLY from the URL-encoded `referrer` param (Install Referrer
             API) — bare utm_* on a details URL is dropped. See partials/cta-block.html. -->
        <a href="https://play.google.com/store/apps/details?id=com.antonchuraev.aichecklists&amp;referrer=utm_source%3Dgallery%26utm_medium%3Dorganic%26utm_campaign%3Dchecklist_index"
           class="inline-flex items-center" aria-label="Get Gisti on Google Play">
          <img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png"
               alt="Get it on Google Play" style="height:72px;display:block" />
        </a>
        <a href="https://app.gisti-ai.com" class="btn btn-on-gradient btn-pill" style="height:52px;font-size:16px">
          <span aria-hidden="true" class="material-symbols-outlined" style="font-size:18px">public</span>{{uiBottomOpenWeb}}
        </a>
      </div>
    </div>
  </section>
