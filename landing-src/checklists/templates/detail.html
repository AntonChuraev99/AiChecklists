  <main class="wrap">
    {{breadcrumb}}

    <article class="max-w-[760px]">
      <h1 class="t-display-s md:t-display-l mb-4">{{h1}}</h1>
      <p class="t-body-l text-on-surface-variant max-w-[60ch] mb-3">{{intro}}</p>
      <!-- Byline — visible author + freshness, matching the WebPage schema dateModified (GEO E-E-A-T). -->
      <p class="t-body-m text-on-surface-variant mb-8 flex items-center gap-2">
        <span aria-hidden="true" class="material-symbols-outlined text-success" style="font-size:18px">verified</span>
        {{uiCurated}} <time datetime="{{reviewedIso}}">{{reviewedLabel}}</time>
      </p>

      <!-- D. The checklist (crawlable list — the core asset) -->
      <h2 class="t-headline-s mt-10 mb-4">{{title}} <span class="t-body-m text-on-surface-variant font-normal">· {{count}} {{uiItems}}</span></h2>
      {{listOpen}}
{{items}}
      {{listClose}}

      <!-- E. Make it yours -->
      <div class="ai-border rounded-xl p-5 md:p-6 mt-10">
        <div class="flex items-start gap-3">
          <span aria-hidden="true" class="material-symbols-outlined ai-text shrink-0" style="font-size:24px">auto_awesome</span>
          <div>
            <h3 class="t-title-m mb-1">{{uiMakeTitle}}</h3>
            <p class="t-body-m text-on-surface-variant mb-3">{{uiMakeBody}}</p>
            <a href="https://app.gisti-ai.com" class="btn btn-secondary btn-pill h-10 px-4 t-label-l">
              <span aria-hidden="true" class="material-symbols-outlined" style="font-size:18px">open_in_new</span>
              {{uiOpenGisti}}
            </a>
          </div>
        </div>
      </div>

      <!-- F. Primary CTA -->
      <div class="mt-10">
      {{cta}}
      </div>
    </article>

    <!-- G. Related checklists (full wrap) -->
    <section class="mt-16" aria-label="Related checklists">
      <h2 class="t-headline-s mb-6">{{uiRelated}}</h2>
      <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
{{related}}
      </div>
    </section>

    <!-- H. FAQ -->
    <section class="mt-16 mb-20 max-w-[760px]" aria-label="Frequently asked questions">
      <h2 class="t-headline-s mb-6">{{uiFaqHeading}}</h2>
{{faq}}
    </section>
  </main>
