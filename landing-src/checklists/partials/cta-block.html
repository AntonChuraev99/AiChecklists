<div class="ai-border rounded-xl p-6 md:p-8">
        <h2 class="t-title-l mb-4">{{uiCtaTitle}}</h2>
        <div class="flex flex-wrap items-center gap-3">
          <!-- Deep-link: opens the app's create flow pre-seeded with this template. Until the app-side
               ?g=create&template= handler ships (@wasmjs-expert follow-up), it safely opens the web app. -->
          <a href="https://app.gisti-ai.com/?g=create&amp;template={{slug}}&amp;utm_source=gallery&amp;utm_medium=organic&amp;utm_campaign={{utmCampaign}}"
             class="btn btn-primary btn-pill" style="height:52px;font-size:16px">
            <span aria-hidden="true" class="material-symbols-outlined" style="font-size:18px">public</span>
            {{uiCtaUse}}
          </a>
          <!-- Official Google Play badge — unmodified, per Google Play brand guidelines -->
          <a href="https://play.google.com/store/apps/details?id=com.antonchuraev.aichecklists&amp;utm_source=gallery&amp;utm_medium=organic&amp;utm_campaign={{utmCampaign}}"
             class="inline-flex items-center" aria-label="Get Gisti on Google Play">
            <img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png"
                 alt="Get it on Google Play" style="height:72px;display:block" />
          </a>
          <a href="https://app.gisti-ai.com" class="btn btn-secondary btn-pill" style="height:52px;font-size:16px">
            <span aria-hidden="true" class="material-symbols-outlined" style="font-size:18px">open_in_new</span>
            {{uiCtaOpenWeb}}
          </a>
        </div>
        <p class="t-body-m text-on-surface-variant mt-5 flex items-center gap-2">
          <span aria-hidden="true" class="material-symbols-outlined text-success" style="font-size:18px">verified</span>
          {{uiCtaTrust}}
        </p>
      </div>
