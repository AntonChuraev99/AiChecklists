  <style>
    html { scroll-behavior: smooth; }
    :where(section[id], main#top) { scroll-margin-top: 84px; }
    body { font-family: Roboto, system-ui, sans-serif; color: var(--on-surface); background: var(--surface); }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; line-height: 1; }
    .wrap { width: 100%; max-width: 1120px; margin-inline: auto; padding-inline: 24px; }

    /* Sticky frosted header */
    .site-header { position: sticky; top: 0; z-index: 50; background: rgba(251,250,248,.82);
      backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
      border-bottom: 1px solid var(--outline-variant); }

    /* CSS-only mobile nav (checkbox hack, zero JS) */
    #nav-toggle { display: none; }
    .nav-panel { display: flex; align-items: center; gap: 28px; }
    .nav-burger { display: none; }
    .nav-open-cta { white-space: nowrap; }
    .nav-open-short { display: none; }
    @media (max-width: 860px) {
      .nav-panel { position: absolute; left: 0; right: 0; top: 100%; flex-direction: column; align-items: stretch;
        gap: 4px; padding: 12px 24px 20px; background: var(--surface); border-bottom: 1px solid var(--outline-variant);
        transform: translateY(-8px); opacity: 0; pointer-events: none; transition: .18s ease; }
      #nav-toggle:checked ~ .nav-panel { transform: translateY(0); opacity: 1; pointer-events: auto; }
      .nav-panel a { padding: 12px 8px; }
      .nav-burger { display: inline-flex; }
      .nav-desktop-cta { display: none; }
      /* Compact primary CTA (short "Open" label) so it fits the bar beside the burger on small phones. */
      .nav-open-cta { padding-inline: 14px; }
      .nav-open-full { display: none; }
      .nav-open-short { display: inline; }
    }

    /* Input-source / feature chips */
    .src-chip { display: inline-flex; align-items: center; gap: 6px;
      background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 999px;
      padding: 8px 14px; font: 500 13px/1 Roboto; color: var(--on-surface); }
    .src-chip .material-symbols-outlined { font-size: 18px; }

    /* FAQ accordion (native <details>) */
    details.faq { border-bottom: 1px solid var(--outline-variant); }
    details.faq > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between;
      align-items: center; gap: 16px; padding: 20px 4px; font-weight: 600; }
    details.faq > summary::-webkit-details-marker { display: none; }
    details.faq > summary .chev { transition: transform .2s ease; color: var(--on-surface-variant); }
    details.faq[open] > summary .chev { transform: rotate(180deg); }
    details.faq .ans { padding: 0 4px 20px; color: var(--on-surface-variant); max-width: 68ch; }

    /* Scroll-driven reveal — progressive enhancement, respects reduced motion */
    @media (prefers-reduced-motion: no-preference) {
      @supports (animation-timeline: view()) {
        .reveal { animation: reveal-up linear both; animation-timeline: view(); animation-range: entry 0% cover 22%; }
        @keyframes reveal-up { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
        .ai-fill, .ai-fill-hero { background-size: 160% 160%; animation: ai-drift 14s ease-in-out infinite; }
        @keyframes ai-drift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
      }
    }
    .lift { transition: transform .15s ease, box-shadow .15s ease; }
    .lift:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(20,30,60,.10); }

    /* ── §4 gallery additions (breadcrumbs + list-reset) ── */
    .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .crumbs li { display: inline-flex; align-items: center; gap: 8px; }
    .crumbs .sep { color: var(--on-surface-variant); }
    ul.checklist, ol.checklist { margin: 0; padding: 0; list-style: none; }
  </style>
