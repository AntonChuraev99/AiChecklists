  <!-- ======================= HEADER / NAV (main-site, absolute links) ======================= -->
  <header class="site-header">
    <div class="wrap flex items-center justify-between h-16 relative">
      <a href="https://gisti-ai.com/" class="flex items-center gap-2" aria-label="Gisti home">
        <img src="/favicon.svg" class="w-8 h-8" width="32" height="32" alt="Gisti app icon" />
        <span class="text-[20px] font-bold tracking-tight">Gisti</span>
      </a>

      <!-- Right cluster: collapsing nav + Log in (in burger on mobile) · always-visible primary · burger toggle.
           #nav-toggle must precede .nav-panel as a sibling for the CSS-only (#nav-toggle:checked ~ .nav-panel) hack. -->
      <div class="flex items-center gap-3">
        <input type="checkbox" id="nav-toggle" aria-hidden="true" />

        <nav class="nav-panel t-label-l">
          <a href="https://gisti-ai.com/#features" class="text-on-surface-variant hover:text-primary">Features</a>
          <a href="https://gisti-ai.com/#how" class="text-on-surface-variant hover:text-primary">How it works</a>
          <a href="https://gisti-ai.com/#pricing" class="text-on-surface-variant hover:text-primary">Pricing</a>
          <a href="https://gisti-ai.com/#faq" class="text-on-surface-variant hover:text-primary">FAQ</a>
          <a href="/mcp" class="text-on-surface-variant hover:text-primary">Use in Claude</a>
          <a href="https://app.gisti-ai.com" class="btn btn-text h-10 px-4" aria-label="Log in to the Gisti web app">Log in</a>
        </nav>

        <!-- Primary conversion: open the web app. Stays visible in the bar on mobile too (outside .nav-panel). -->
        <a href="https://app.gisti-ai.com" class="btn btn-primary btn-pill h-10 px-5 nav-open-cta" aria-label="Open the Gisti web app">
          <span aria-hidden="true" class="material-symbols-outlined nav-open-icon" style="font-size:18px">public</span>
          <span class="nav-open-full">Open web app</span>
          <span class="nav-open-short">Open</span>
        </a>

        <label for="nav-toggle" class="nav-burger btn-text btn h-10 px-2" aria-label="Toggle menu">
          <span aria-hidden="true" class="material-symbols-outlined">menu</span>
        </label>
      </div>
    </div>
  </header>
